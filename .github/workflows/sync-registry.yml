name: Sync speedtest registry

on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-registry.yml"
      - ".github/workflows/release.yaml"
      - "cmd/update-registry/**"
      - "model/registry*.go"
      - "model/snapshot/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

concurrency:
  group: speedtest-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Update embedded registry
        run: go run ./cmd/update-registry -output model/snapshot/speedtest-servers.json -manifest model/snapshot/manifest.json -allow-stale
      - name: Verify snapshot
        run: |
          go mod verify
          test "$(go list -m -f '{{.Version}}' github.com/oneclickvirt/basics)" = "v0.0.38"
          go test -race ./...
          go vet ./...
          git diff --check
      - name: Commit semantic changes
        run: |
          if [[ -z "$(git status --porcelain -- model/snapshot/speedtest-servers.json model/snapshot/manifest.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/snapshot/speedtest-servers.json model/snapshot/manifest.json
          git commit -m "chore: sync speedtest registry"
          git push
