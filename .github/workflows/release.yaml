name: Prepare and Tag Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic version tag; leave empty to use SpeedTestVersion
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: speedtest-release-registry
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - id: release
        name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^const SpeedTestVersion = "\(v[0-9.]*\)"$/\1/p' model/model.go)"
          tag="${{ inputs.release_tag }}"
          [[ -n "$tag" ]] || tag="$version"
          [[ "$tag" == "$version" ]]
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --tags origin
          ! git rev-parse --verify --quiet "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Refresh embedded speedtest registry
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/update-registry \
            -output model/snapshot/speedtest-servers.json \
            -manifest model/snapshot/manifest.json \
            -allow-stale
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          test "$(go list -m -f '{{.Version}}' github.com/showwin/speedtest-go)" = "v1.8.3"
          go test -race -count=1 ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/speedtest" ./cmd
          git diff --check
      - name: Commit refreshed registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- model/snapshot)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/snapshot
          git commit -m "chore(data): refresh speedtest registry"
          git push origin HEAD:main
      - name: Create immutable release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
