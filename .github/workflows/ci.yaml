name: CI

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        # 移除 -coverprofile 参数以避免在某些 Go 版本/环境中触发 `go tool covdata` 错误
        run: go test -race -count=1 ./...
      - name: Verify upstream speedtest-go version
        run: |
          set -euo pipefail
          grep -Fq 'github.com/showwin/speedtest-go v1.8.2' go.mod
          test "$(go list -m -f '{{.Version}}' github.com/showwin/speedtest-go)" = 'v1.8.2'
      - name: Create Tag
        if: success() # 仅在测试成功时运行
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          TAG="$(sed -n 's/^const SpeedTestVersion = "\(v[0-9.]*\)"$/\1/p' model/model.go)"
          if [[ -z "$TAG" ]]; then
            echo "Unable to derive SpeedTestVersion from model/model.go" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin $TAG
          echo "TAG=$TAG" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md
        if: success() # 仅在测试成功后运行
        run: |
          sed -i "s|go get github.com/oneclickvirt/speedtest@.*|go get github.com/oneclickvirt/speedtest@${TAG}|" README.md
        env:
          TAG: ${{ env.TAG }}

      - name: Commit and Push README.md
        if: success() # 仅在测试成功后运行
        run: |
          set -euo pipefail
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README.md with new tag ${TAG}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
